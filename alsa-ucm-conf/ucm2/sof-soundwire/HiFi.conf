# Use case Configuration for sof-soundwire card
#
# brunch: same structure as alsa-ucm-conf 1.2.8, plus the cras profiles in
# sof-soundwire/cras/ (see sof-soundwire.conf).  CrasProfile is "1" when every
# function on the card has a profile there; CrasHsFile / CrasSpkFile /
# CrasMicFile name the file for each function.

SectionVerb {
	EnableSequence [
		disdevall ""
	]

	Value {
		TQ "HiFi"
		# cras only builds nodes from the SectionDevices below when this
		# is exactly "1"; otherwise it guesses from mixer control names.
		FullySpecifiedUCM "${var:CrasProfile}"
	}
}

# cras profiles: one include per function file, each file at most once.
If.cras {
	Condition {
		Type String
		Empty "${var:CrasProfile}"
	}
	False {
		If.cras_hs {
			Condition {
				Type String
				Empty "${var:CrasHsFile}"
			}
			False.Include.cras_hs.File "/sof-soundwire/cras/${var:CrasHsFile}.conf"
		}

		If.cras_spk {
			Condition {
				Type String
				Empty "${var:CrasSpkFile}"
			}
			False.If.cras_spk_dup {
				Condition {
					Type String
					String1 "${var:CrasSpkFile}"
					String2 "${var:CrasHsFile}"
				}
				False.Include.cras_spk.File "/sof-soundwire/cras/${var:CrasSpkFile}.conf"
			}
		}

		If.cras_mic {
			Condition {
				Type String
				Empty "${var:CrasMicFile}"
			}
			False.If.cras_mic_dup1 {
				Condition {
					Type String
					String1 "${var:CrasMicFile}"
					String2 "${var:CrasHsFile}"
				}
				False.If.cras_mic_dup2 {
					Condition {
						Type String
						String1 "${var:CrasMicFile}"
						String2 "${var:CrasSpkFile}"
					}
					False.Include.cras_mic.File "/sof-soundwire/cras/${var:CrasMicFile}.conf"
				}
			}
		}
	}
}

# alsa-ucm-conf 1.2.8 device files, used when CrasProfile is empty.
If.spkdev {
	Condition {
		Type String
		Empty "${var:SpeakerCodec1}"
	}
	False.If.spkdev_legacy {
		Condition {
			Type String
			Empty "${var:CrasProfile}"
		}
		True.Include.spkdev.File "/sof-soundwire/${var:SpeakerCodec1}-${var:SpeakerAmps1}.conf"
	}
}

If.micdev {
	Condition {
		Type String
		Empty "${var:MicCodec1}"
	}
	False.If.micdev_legacy {
		Condition {
			Type String
			Empty "${var:CrasProfile}"
		}
		True.Include.micdev.File "/sof-soundwire/${var:MicCodec1}.conf"
	}
}

If.hsdev {
	Condition {
		Type String
		Empty "${var:HeadsetCodec1}"
	}
	False.If.hsdev_legacy {
		Condition {
			Type String
			Empty "${var:CrasProfile}"
		}
		True.Include.hsdev.File "/sof-soundwire/${var:HeadsetCodec1}.conf"
	}
}

If.hdmi {
	Condition {
		Type String
		Empty "${var:CrasProfile}"
	}
	True.Include.hdmi.File "/sof-soundwire/Hdmi.conf"
	False.Include.hdmi.File "/sof-soundwire/cras/Hdmi.conf"
}
