# Use case Configuration for sof-soundwire card
#
# brunch: same structure as alsa-ucm-conf 1.2.8, plus the cras profiles for
# the Cirrus Logic codecs (see sof-soundwire.conf).  CrasProfile is "1" when
# every codec on the card has a profile in sof-soundwire/cras/.

SectionVerb {
	EnableSequence [
		disdevall ""
	]

	Value {
		TQ "HiFi"
		# cras only builds nodes from the SectionDevices below when this
		# is exactly "1"; otherwise it guesses from mixer control names.
		FullySpecifiedUCM "${var:CrasProfile}"
	}
}

If.spkdev {
	Condition {
		Type String
		Empty "${var:SpeakerCodec1}"
	}
	False.If.spkdev_cras {
		Condition {
			Type String
			Empty "${var:CrasProfile}"
		}
		True.Include.spkdev.File "/sof-soundwire/${var:SpeakerCodec1}-${var:SpeakerAmps1}.conf"
		False.Include.spkdev.File "/sof-soundwire/cras/${var:SpeakerCodec1}.conf"
	}
}

If.micdev {
	Condition {
		Type String
		Empty "${var:MicCodec1}"
	}
	False.If.micdev_cras {
		Condition {
			Type String
			Empty "${var:CrasProfile}"
		}
		True.Include.micdev.File "/sof-soundwire/${var:MicCodec1}.conf"
		False.Include.micdev.File "/sof-soundwire/cras/${var:MicCodec1}.conf"
	}
}

If.hsdev {
	Condition {
		Type String
		Empty "${var:HeadsetCodec1}"
	}
	False.If.hsdev_cras {
		Condition {
			Type String
			Empty "${var:CrasProfile}"
		}
		True.Include.hsdev.File "/sof-soundwire/${var:HeadsetCodec1}.conf"
		False.Include.hsdev.File "/sof-soundwire/cras/${var:HeadsetCodec1}.conf"
	}
}

If.hdmi {
	Condition {
		Type String
		Empty "${var:CrasProfile}"
	}
	True.Include.hdmi.File "/sof-soundwire/Hdmi.conf"
	False.Include.hdmi.File "/sof-soundwire/cras/Hdmi.conf"
}
