# cras profile: HDMI / DisplayPort outputs (PCM 5, 6, 7 on every SOF
# SoundWire topology).
#
# Differs from codecs/hda/hdmi.conf only in the jack: that macro uses
# JackControl, and in FullySpecifiedUCM mode cras looks the control up with
# the PCM number as the control's device field.  The kernel creates jack
# controls with device 0, so the lookup fails and cras gives up on the whole
# card.  The jack input device ("<card name> HDMI/DP,pcm=N") is matched by
# name instead, which fails soft (no plug detection) rather than fatally.

DefineMacro.CrasHDMI.If.hdmi {
	Condition {
		Type ControlExists
		Control "iface=CARD,name='HDMI/DP,pcm=${var:__Device} Jack'"
	}
	True {
		SectionDevice."HDMI${var:__Number}" {
			Comment "HDMI / DisplayPort ${var:__Number} Output"

			EnableSequence [
				cset "name='IEC958 Playback Switch',index=${eval:($__Number-1)} on"
			]

			DisableSequence [
				cset "name='IEC958 Playback Switch',index=${eval:($__Number-1)} off"
			]

			Value {
				PlaybackPriority "${var:__Priority}"
				PlaybackPCM "hw:${CardId},${var:__Device}"
				JackDev "${CardName} HDMI/DP,pcm=${var:__Device}"
			}
		}
	}
}

If.hdmi1 {
	Condition { Type AlwaysTrue }
	True.Macro.hdmi1.CrasHDMI {
		Number 1
		Device 5
		Priority 500
	}
}

If.hdmi2 {
	Condition { Type AlwaysTrue }
	True.Macro.hdmi2.CrasHDMI {
		Number 2
		Device 6
		Priority 600
	}
}

If.hdmi3 {
	Condition { Type AlwaysTrue }
	True.Macro.hdmi3.CrasHDMI {
		Number 3
		Device 7
		Priority 700
	}
}
