# cras profile: Realtek rt1316 SoundWire amplifiers ("rt1316-1", "rt1316-2"),
# "Speaker" PCM 2.  Kernel 7.1 exposes one "DAC Switch" per amplifier (older
# drivers had "DAC L Switch" / "DAC R Switch"; both forms are handled).  RX
# Channel Select values carry a comma ("L,R", "L,L", "R,R") exactly as the
# driver names them.  No volume control; cras uses software volume.

DefineMacro.CrasRt1316Amp.If.amp {
	Condition {
		Type ControlExists
		Control "name='rt1316-${var:__Amp} RX Channel Select'"
	}
	True {
		EnableSequence [
			cset "name='rt1316-${var:__Amp} RX Channel Select' ${var:__Sel}"
		]
		If.lr {
			Condition {
				Type ControlExists
				Control "name='rt1316-${var:__Amp} DAC L Switch'"
			}
			True {
				EnableSequence [
					cset "name='rt1316-${var:__Amp} DAC L Switch' 1"
					cset "name='rt1316-${var:__Amp} DAC R Switch' 1"
				]
				DisableSequence [
					cset "name='rt1316-${var:__Amp} DAC L Switch' 0"
					cset "name='rt1316-${var:__Amp} DAC R Switch' 0"
				]
			}
			False {
				EnableSequence [
					cset "name='rt1316-${var:__Amp} DAC Switch' 1"
				]
				DisableSequence [
					cset "name='rt1316-${var:__Amp} DAC Switch' 0"
				]
			}
		}
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	If.two {
		Condition {
			Type ControlExists
			Control "name='rt1316-2 RX Channel Select'"
		}
		True {
			Macro.amp1.CrasRt1316Amp { Amp 1  Sel "L,L" }
			Macro.amp2.CrasRt1316Amp { Amp 2  Sel "R,R" }
		}
		False.Macro.amp1.CrasRt1316Amp { Amp 1  Sel "L,R" }
	}

	EnableSequence [
		cset "name='Speaker Switch' on"
	]

	DisableSequence [
		cset "name='Speaker Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},2"
	}
}
