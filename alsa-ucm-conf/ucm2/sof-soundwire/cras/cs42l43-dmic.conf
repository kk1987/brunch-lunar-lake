# cras profile: digital microphones attached to the cs42l43 (cs42l43-dp1,
# SOC_SDW_DAI_TYPE_MIC -> "Microphones" PCM 4).  "Internal Mic" is cras's name
# for the built-in microphone node; it is always plugged.

If.CS42L43B {
	Condition {
		Type ControlExists
		Control "name='cs42l43 Decimator 5 Switch'"
	}
	True.SectionDevice."Internal Mic" {
		Comment "Internal Microphones"

		EnableSequence [
			cset "name='cs42l43 DP1TX1 Input' 'Decimator 5'"
			cset "name='cs42l43 DP1TX2 Input' 'Decimator 6'"
			cset "name='cs42l43 DP1TX3 Input' 'Decimator 3'"
			cset "name='cs42l43 DP1TX4 Input' 'Decimator 4'"
			cset "name='cs42l43 Decimator 5 Switch' 1"
			cset "name='cs42l43 Decimator 6 Switch' 1"
			cset "name='cs42l43 Decimator 3 Switch' 1"
			cset "name='cs42l43 Decimator 4 Switch' 1"
		]

		DisableSequence [
			cset "name='cs42l43 DP1TX1 Input' 'None'"
			cset "name='cs42l43 DP1TX2 Input' 'None'"
			cset "name='cs42l43 DP1TX3 Input' 'None'"
			cset "name='cs42l43 DP1TX4 Input' 'None'"
		]

		Value {
			CapturePriority 100
			CapturePCM "hw:${CardId},4"
		}
	}
	False.SectionDevice."Internal Mic" {
		Comment "Internal Microphones"

		EnableSequence [
			cset "name='cs42l43 DP1TX1 Input' 'Decimator 3'"
			cset "name='cs42l43 DP1TX2 Input' 'Decimator 4'"
			cset "name='cs42l43 Decimator 3 Switch' 1"
			cset "name='cs42l43 Decimator 4 Switch' 1"
		]

		DisableSequence [
			cset "name='cs42l43 DP1TX1 Input' 'None'"
			cset "name='cs42l43 DP1TX2 Input' 'None'"
		]

		Value {
			CapturePriority 100
			CapturePCM "hw:${CardId},4"
		}
	}
}
