# cras profile: Realtek rt714 SoundWire microphone array (SDCA driver, prefix
# "rt714"; the kernel reports it as mic:rt715-sdca for UCM compatibility),
# "Microphones" PCM 4.  ADC 22 / 23 muxes on DMIC3 / DMIC4, FU02 as the
# capture switch and volume, FU0A muted as upstream does.

SectionDevice."Internal Mic" {
	Comment "Internal Microphones"

	EnableSequence [
		cset "name='rt714 ADC 22 Mux' 'DMIC3'"
		cset "name='rt714 ADC 23 Mux' 'DMIC4'"
		cset "name='rt714 FU02 Capture Switch' 1,1"
		cset "name='rt714 FU0A Capture Switch' 0,0"
		cset "name='rt714 FU02 Capture Volume' 47,47"
	]

	DisableSequence [
		cset "name='rt714 FU02 Capture Switch' 0,0"
	]

	If.micvol {
		Condition {
			Type ControlExists
			Control "name='rt714 FU02 Capture Volume'"
		}
		True.Value.CaptureMixerElem "rt714 FU02"
	}

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},4"
	}
}
