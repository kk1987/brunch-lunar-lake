# cras profile: Realtek rt722 SDCA multi-function codec -- headset, speaker
# amplifier and digital microphones on one SoundWire peripheral.
#
# Kernel 7.1 DAI mapping (sound/soc/sdw_utils/soc_sdw_utils.c):
#   rt722-sdca-aif1  jack   -> "Jack Out" PCM 0 / "Jack In" PCM 1
#   rt722-sdca-aif2  amp    -> "Speaker" PCM 2
#   rt722-sdca-aif3  dmic   -> "Microphones" PCM 4
# The card reports hs:rt722 spk:rt722 mic:rt722, so sof-soundwire.conf
# includes this one file for all three functions (CrasMulti).  The machine
# driver adds card-level pin switches ("Headphone Switch", "Headset Mic
# Switch", "Speaker Switch"); the codec's own controls carry the "rt722 "
# prefix.  The jack input device is "<card name> Headset Jack".
#
# Upstream alsa-ucm-conf sets the ADC muxes and volume defaults from a
# BootSequence, which cras never runs; they are folded into the device
# EnableSequences here, volumes last so a mismatch cannot block the routing.
# cras owns the volumes through the mixer elements once it has them.

SectionDevice."Headphone" {
	Comment "Headphones"

	EnableSequence [
		cset "name='Headphone Switch' on"
		cset "name='rt722 FU05 Playback Volume' 87,87"
	]

	DisableSequence [
		cset "name='Headphone Switch' off"
	]

	If.hpvol {
		Condition {
			Type ControlExists
			Control "name='rt722 FU05 Playback Volume'"
		}
		True.Value.PlaybackMixerElem "rt722 FU05"
	}

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		JackDev "${CardName} Headset Jack"
	}
}

SectionDevice."Mic" {
	Comment "Headset Microphone"

	EnableSequence [
		cset "name='rt722 ADC 22 Mux' 'MIC2'"
		cset "name='Headset Mic Switch' on"
		cset "name='rt722 FU0F Capture Switch' 1,1"
		cset "name='rt722 FU0F Capture Volume' 63,63"
	]

	DisableSequence [
		cset "name='rt722 FU0F Capture Switch' 0,0"
		cset "name='Headset Mic Switch' off"
	]

	If.micvol {
		Condition {
			Type ControlExists
			Control "name='rt722 FU0F Capture Volume'"
		}
		True.Value.CaptureMixerElem "rt722 FU0F"
	}

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		JackDev "${CardName} Headset Jack"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	EnableSequence [
		cset "name='Speaker Switch' on"
		cset "name='rt722 FU06 Playback Volume' 60,60"
	]

	DisableSequence [
		cset "name='Speaker Switch' off"
	]

	If.spkvol {
		Condition {
			Type ControlExists
			Control "name='rt722 FU06 Playback Volume'"
		}
		True.Value.PlaybackMixerElem "rt722 FU06"
	}

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},2"
	}
}

# Skipped when the card's microphones are the PCH DMICs (mic:dmic), which
# then come from cras/dmic.conf instead.
If.dmic {
	Condition {
		Type String
		Empty "${var:CrasRt722Mic}"
	}
	False.SectionDevice."Internal Mic" {
		Comment "Internal Microphones"

		EnableSequence [
			cset "name='rt722 ADC 24 Mux' 'DMIC1'"
			cset "name='rt722 ADC 25 Mux' 'DMIC2'"
			cset "name='rt722 FU1E Capture Switch' 1,1,1,1"
			cset "name='rt722 FU1E Capture Volume' 63,63,63,63"
		]

		DisableSequence [
			cset "name='rt722 FU1E Capture Switch' 0,0,0,0"
		]

		If.dmicvol {
			Condition {
				Type ControlExists
				Control "name='rt722 FU1E Capture Volume'"
			}
			True.Value.CaptureMixerElem "rt722 FU1E"
		}

		Value {
			CapturePriority 100
			CapturePCM "hw:${CardId},4"
		}
	}
}
