# cras profile: PCH digital microphones on the SOF DMIC link ("DMIC Raw" PCM,
# number looked up by name).  Same as the 1.2.8 profile except for the node
# name: cras treats "Internal Mic" as the always-plugged built-in microphone,
# while a plain "Mic" is an external node that stays unplugged without a jack.

SectionDevice."Internal Mic" {
	Comment "Digital Microphones"

	If.dmicvol {
		Condition {
			Type ControlExists
			Control "name='Dmic0 Capture Volume'"
		}
		True.Value.CaptureMixerElem "Dmic0"
	}

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},${find-device:type=pcm,stream=capture,field=id,regex='DMIC '}"
	}
}
