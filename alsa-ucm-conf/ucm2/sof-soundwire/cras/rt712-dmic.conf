# cras profile: Realtek rt1712 SoundWire DMIC part (prefix "rt712-dmic",
# reported as mic:rt712-dmic), "Microphones" PCM 4.  ADC 25 / 26 muxes on
# DMIC1 / DMIC2, FU1E as the capture switch and volume.

SectionDevice."Internal Mic" {
	Comment "Internal Microphones"

	EnableSequence [
		cset "name='rt712-dmic ADC 25 Mux' 'DMIC1'"
		cset "name='rt712-dmic ADC 26 Mux' 'DMIC2'"
		cset "name='rt712-dmic FU1E Capture Switch' 1,1,1,1"
	]

	DisableSequence [
		cset "name='rt712-dmic FU1E Capture Switch' 0,0,0,0"
	]

	If.micvol {
		Condition {
			Type ControlExists
			Control "name='rt712-dmic FU1E Capture Volume'"
		}
		True.Value.CaptureMixerElem "rt712-dmic FU1E"
	}

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},4"
	}
}
