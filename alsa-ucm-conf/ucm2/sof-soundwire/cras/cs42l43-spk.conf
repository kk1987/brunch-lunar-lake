# cras profile: speakers driven by the cs42l43's own amplifier outputs
# (cs42l43-dp6, SOC_SDW_DAI_TYPE_AMP -> "Speaker" PCM 2 on kernel 7.1;
# older kernels fed the speaker path from DP5 on the jack PCM instead).
# "Speaker Digital Switch" is a stereo control: cset takes one value per
# channel, alsa-lib 1.2.8 does not repeat a single value across channels.

SectionDevice."Speaker" {
	Comment "Speaker"

	EnableSequence [
		cset "name='cs42l43 Speaker L Input 1' 'DP6RX1'"
		cset "name='cs42l43 Speaker R Input 1' 'DP6RX2'"
		cset "name='cs42l43 Speaker Digital Switch' 1,1"
	]

	DisableSequence [
		cset "name='cs42l43 Speaker Digital Switch' 0,0"
		cset "name='cs42l43 Speaker L Input 1' 'None'"
		cset "name='cs42l43 Speaker R Input 1' 'None'"
	]

	If.spkvol {
		Condition {
			Type ControlExists
			Control "name='cs42l43 Speaker Digital Volume'"
		}
		True.Value.PlaybackMixerElem "cs42l43 Speaker Digital"
	}

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},2"
	}
}
