# cras profile: Realtek rt711 (SDCA driver, kernel part 0x711 version 3)
# headset codec.  Jack DAI rt711-sdca-aif1 -> "Jack Out" PCM 0 / "Jack In"
# PCM 1; jack input device "<card name> Headset Jack"; machine-driver pin
# switches "Headphone Switch" / "Headset Mic Switch"; codec controls carry
# the "rt711 " prefix.  Upstream's BootSequence (ADC mux, volume defaults) is
# folded into the enable sequences, volumes last.

SectionDevice."Headphone" {
	Comment "Headphones"

	EnableSequence [
		cset "name='Headphone Switch' on"
		cset "name='rt711 FU05 Playback Volume' 87,87"
	]

	DisableSequence [
		cset "name='Headphone Switch' off"
	]

	If.hpvol {
		Condition {
			Type ControlExists
			Control "name='rt711 FU05 Playback Volume'"
		}
		True.Value.PlaybackMixerElem "rt711 FU05"
	}

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		JackDev "${CardName} Headset Jack"
	}
}

SectionDevice."Mic" {
	Comment "Headset Microphone"

	EnableSequence [
		cset "name='rt711 ADC 22 Mux' 'MIC2'"
		cset "name='Headset Mic Switch' on"
		cset "name='rt711 FU0F Capture Switch' 1,1"
		cset "name='rt711 FU0F Capture Volume' 57,57"
	]

	DisableSequence [
		cset "name='rt711 FU0F Capture Switch' 0,0"
		cset "name='Headset Mic Switch' off"
	]

	If.micvol {
		Condition {
			Type ControlExists
			Control "name='rt711 FU0F Capture Volume'"
		}
		True.Value.CaptureMixerElem "rt711 FU0F"
	}

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		JackDev "${CardName} Headset Jack"
	}
}
