# cras profile: Cirrus Logic cs42l43 headset codec on SoundWire.
#
# Kernel 7.1 DAI mapping (sound/soc/sdw_utils/soc_sdw_utils.c):
#   cs42l43-dp5  jack playback  -> "Jack Out" PCM 0
#   cs42l43-dp2  jack capture   -> "Jack In"  PCM 1
# The jack is one input device, "<card name> Jack", reporting both
# SW_HEADPHONE_INSERT and SW_MICROPHONE_INSERT; cras picks the switch from
# the device direction.  Device names follow cras's conventions ("Headphone"
# and "Mic" are external nodes whose plugged state comes from the jack).
# Mixer elements are only declared when the control exists: cras drops the
# whole card if a declared element is missing.

SectionDevice."Headphone" {
	Comment "Headphones"

	EnableSequence [
		cset "name='cs42l43 Headphone L Input 1' 'DP5RX1'"
		cset "name='cs42l43 Headphone R Input 1' 'DP5RX2'"
	]

	DisableSequence [
		cset "name='cs42l43 Headphone L Input 1' 'None'"
		cset "name='cs42l43 Headphone R Input 1' 'None'"
	]

	If.hpvol {
		Condition {
			Type ControlExists
			Control "name='cs42l43 Headphone Digital Volume'"
		}
		True.Value.PlaybackMixerElem "cs42l43 Headphone Digital"
	}

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		JackDev "${CardName} Jack"
	}
}

# CS42L43B exposes Decimators 5/6 and has no "Decimator 1 Mode" control.
If.CS42L43B {
	Condition {
		Type ControlExists
		Control "name='cs42l43 Decimator 5 Switch'"
	}
	True.SectionDevice."Mic" {
		Comment "Headset Microphone"

		EnableSequence [
			cset "name='cs42l43 ADC1 Input' 'IN1'"
			cset "name='cs42l43 DP2TX1 Input' 'Decimator 1'"
			cset "name='cs42l43 DP2TX2 Input' 'Decimator 1'"
			cset "name='cs42l43 Decimator 1 Switch' 1"
		]

		DisableSequence [
			cset "name='cs42l43 DP2TX1 Input' 'None'"
			cset "name='cs42l43 DP2TX2 Input' 'None'"
		]

		If.micvol {
			Condition {
				Type ControlExists
				Control "name='cs42l43 Decimator 1 Volume'"
			}
			True.Value.CaptureMixerElem "cs42l43 Decimator 1"
		}

		Value {
			CapturePriority 200
			CapturePCM "hw:${CardId},1"
			JackDev "${CardName} Jack"
		}
	}
	False.SectionDevice."Mic" {
		Comment "Headset Microphone"

		EnableSequence [
			cset "name='cs42l43 ADC1 Input' 'IN1'"
			cset "name='cs42l43 Decimator 1 Mode' 'ADC'"
			cset "name='cs42l43 DP2TX1 Input' 'Decimator 1'"
			cset "name='cs42l43 DP2TX2 Input' 'Decimator 1'"
			cset "name='cs42l43 Decimator 1 Switch' 1"
		]

		DisableSequence [
			cset "name='cs42l43 DP2TX1 Input' 'None'"
			cset "name='cs42l43 DP2TX2 Input' 'None'"
		]

		If.micvol {
			Condition {
				Type ControlExists
				Control "name='cs42l43 Decimator 1 Volume'"
			}
			True.Value.CaptureMixerElem "cs42l43 Decimator 1"
		}

		Value {
			CapturePriority 200
			CapturePCM "hw:${CardId},1"
			JackDev "${CardName} Jack"
		}
	}
}
