# cras profile: cs35l56 amplifiers behind the cs42l43's ASP bridge (the
# amplifiers hang off the cs42l43 rather than the SoundWire bus; the machine
# driver names them "AMPL" / "AMPR").  Routing as in upstream alsa-ucm-conf.

Define.CrasBridgeMixers ""

If.ampl {
	Condition {
		Type ControlExists
		Control "name='AMPL Speaker Volume'"
	}
	True {
		Define.CrasBridgeMixers "AMPL Speaker"
		If.ampr {
			Condition {
				Type ControlExists
				Control "name='AMPR Speaker Volume'"
			}
			True.Define.CrasBridgeMixers "AMPL Speaker,AMPR Speaker"
		}
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	EnableSequence [
		cset "name='cs42l43 Speaker L Input 1' 'ASPRX1'"
		cset "name='cs42l43 Speaker R Input 1' 'ASPRX2'"
		cset "name='cs42l43 ASPTX1 Input' 'DP6RX1'"
		cset "name='cs42l43 ASPTX2 Input' 'DP6RX2'"
		cset "name='cs42l43 Speaker Digital Switch' 1,1"

		cset "name='AMPL ASP1 TX1 Source' 'DSP1TX1'"
		cset "name='AMPL ASP1 TX2 Source' 'None'"
		cset "name='AMPL ASP1 TX3 Source' 'None'"
		cset "name='AMPL ASP1 TX4 Source' 'None'"
		cset "name='AMPL Speaker Switch' 1"

		cset "name='AMPR ASP1 TX1 Source' 'None'"
		cset "name='AMPR ASP1 TX2 Source' 'DSP1TX1'"
		cset "name='AMPR ASP1 TX3 Source' 'None'"
		cset "name='AMPR ASP1 TX4 Source' 'None'"
		cset "name='AMPR Speaker Switch' 1"
	]

	DisableSequence [
		cset "name='cs42l43 Speaker Digital Switch' 0,0"
		cset "name='AMPL Speaker Switch' 0"
		cset "name='AMPR Speaker Switch' 0"
		cset "name='cs42l43 ASPTX1 Input' 'None'"
		cset "name='cs42l43 ASPTX2 Input' 'None'"
		cset "name='cs42l43 Speaker L Input 1' 'None'"
		cset "name='cs42l43 Speaker R Input 1' 'None'"
	]

	If.mixers {
		Condition {
			Type String
			Empty "${var:CrasBridgeMixers}"
		}
		False.Value.CoupledMixers "${var:CrasBridgeMixers}"
	}

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},2"
	}
}
