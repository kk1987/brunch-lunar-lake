# cras profile: cs42l43 speaker outputs and cs35l56 amplifiers driving
# separate speakers (tweeters + woofers) on one "Speaker" PCM 2.  Both paths
# are switched together; the cs42l43 digital volume is the node's volume
# control and the amplifiers stay at their 0 dB default.

DefineMacro.CrasAmpSeq.If.amp {
	Condition {
		Type ControlExists
		Control "name='AMP${var:__Amp} Speaker Switch'"
	}
	True {
		EnableSequence [
			cset "name='AMP${var:__Amp} Speaker Switch' 1"
		]
		DisableSequence [
			cset "name='AMP${var:__Amp} Speaker Switch' 0"
		]
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	EnableSequence [
		cset "name='cs42l43 Speaker L Input 1' 'DP6RX1'"
		cset "name='cs42l43 Speaker R Input 1' 'DP6RX2'"
		cset "name='cs42l43 Speaker Digital Switch' 1,1"
	]

	DisableSequence [
		cset "name='cs42l43 Speaker Digital Switch' 0,0"
		cset "name='cs42l43 Speaker L Input 1' 'None'"
		cset "name='cs42l43 Speaker R Input 1' 'None'"
	]

	Macro.amp1.CrasAmpSeq { Amp 1 }
	Macro.amp2.CrasAmpSeq { Amp 2 }
	Macro.amp3.CrasAmpSeq { Amp 3 }
	Macro.amp4.CrasAmpSeq { Amp 4 }
	Macro.amp5.CrasAmpSeq { Amp 5 }
	Macro.amp6.CrasAmpSeq { Amp 6 }
	Macro.amp7.CrasAmpSeq { Amp 7 }
	Macro.amp8.CrasAmpSeq { Amp 8 }

	If.spkvol {
		Condition {
			Type ControlExists
			Control "name='cs42l43 Speaker Digital Volume'"
		}
		True.Value.PlaybackMixerElem "cs42l43 Speaker Digital"
	}

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},2"
	}
}
