# cras profile: Realtek rt711 with the legacy (non-SDCA) driver, kernel part
# 0x711 version 2, reported as hs:rt711.  Same PCM / jack layout as the SDCA
# variant; controls are "rt711 DAC Surr" (headphone) and "rt711 ADC 08"
# (headset microphone), ADC 23 Mux selects MIC2.

SectionDevice."Headphone" {
	Comment "Headphones"

	EnableSequence [
		cset "name='Headphone Switch' on"
		cset "name='rt711 DAC Surr Playback Volume' 87,87"
	]

	DisableSequence [
		cset "name='Headphone Switch' off"
	]

	If.hpvol {
		Condition {
			Type ControlExists
			Control "name='rt711 DAC Surr Playback Volume'"
		}
		True.Value.PlaybackMixerElem "rt711 DAC Surr"
	}

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		JackDev "${CardName} Headset Jack"
	}
}

SectionDevice."Mic" {
	Comment "Headset Microphone"

	EnableSequence [
		cset "name='rt711 ADC 23 Mux' 'MIC2'"
		cset "name='Headset Mic Switch' on"
		cset "name='rt711 ADC 08 Capture Switch' 1,1"
		cset "name='rt711 ADC 08 Capture Volume' 63,63"
		cset "name='rt711 AMIC Volume' 1,1"
	]

	DisableSequence [
		cset "name='rt711 ADC 08 Capture Switch' 0,0"
		cset "name='Headset Mic Switch' off"
	]

	If.micvol {
		Condition {
			Type ControlExists
			Control "name='rt711 ADC 08 Capture Volume'"
		}
		True.Value.CaptureMixerElem "rt711 ADC 08"
	}

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		JackDev "${CardName} Headset Jack"
	}
}
