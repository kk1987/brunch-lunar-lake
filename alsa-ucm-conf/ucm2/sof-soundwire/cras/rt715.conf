# cras profile: Realtek rt715 SoundWire microphone array, "Microphones" PCM 4,
# reported as mic:rt715 by both the legacy rt715 driver and the SDCA driver
# for kernel part 0x715 (prefix "rt715").  Three control layouts exist and are
# probed in turn: a codec "rt715 Capture" switch/volume, the topology's
# "PGA5.0 5 Master Capture" pair, or the SDCA "rt715 FU02" pair (with the ADC
# 22 / 23 muxes on DMIC3 / DMIC4).  Each fragment is guarded, so only the
# controls that exist are touched.  Note the simple mixer element for
# "rt715 Capture Volume" is plain "rt715".

SectionDevice."Internal Mic" {
	Comment "Internal Microphones"

	If.codecsw {
		Condition {
			Type ControlExists
			Control "name='rt715 Capture Switch'"
		}
		True {
			EnableSequence [
				cset "name='rt715 Capture Switch' 1,1,1,1"
			]
			DisableSequence [
				cset "name='rt715 Capture Switch' 0,0,0,0"
			]
			Value.CaptureMixerElem "rt715"
		}
		False.If.pgasw {
			Condition {
				Type ControlExists
				Control "name='PGA5.0 5 Master Capture Switch'"
			}
			True {
				EnableSequence [
					cset "name='PGA5.0 5 Master Capture Switch' 1,1,1,1"
				]
				DisableSequence [
					cset "name='PGA5.0 5 Master Capture Switch' 0,0,0,0"
				]
				Value.CaptureMixerElem "PGA5.0 5 Master"
			}
			False.If.fu02 {
				Condition {
					Type ControlExists
					Control "name='rt715 FU02 Capture Switch'"
				}
				True {
					EnableSequence [
						cset "name='rt715 ADC 22 Mux' 'DMIC3'"
						cset "name='rt715 ADC 23 Mux' 'DMIC4'"
						cset "name='rt715 FU02 Capture Switch' 1,1"
						cset "name='rt715 FU02 Capture Volume' 47,47"
					]
					DisableSequence [
						cset "name='rt715 FU02 Capture Switch' 0,0"
					]
					Value.CaptureMixerElem "rt715 FU02"
				}
			}
		}
	}

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},4"
	}
}
