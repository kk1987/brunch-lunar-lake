# cras profile: Realtek rt1320 SoundWire amplifiers ("rt1320-1", "rt1320-2"),
# "Speaker" PCM 2, switched through the "OT23 L" / "OT23 R" DAPM switches.
# Owns the Speaker for spk:rt1320 and for the rt712+rt1320 / rt721+rt1320
# combinations (sof-soundwire.conf maps those here).  The part also carries a
# SoundWire DMIC function; when the card reports mic:rt1320 this file also
# provides the Internal Mic ("Microphones" PCM 4, "FU Capture" controls).

DefineMacro.CrasRt1320Amp.If.amp {
	Condition {
		Type ControlExists
		Control "name='rt1320-${var:__Amp} OT23 L Switch'"
	}
	True {
		EnableSequence [
			cset "name='rt1320-${var:__Amp} RX Channel Select' ${var:__Sel}"
			cset "name='rt1320-${var:__Amp} OT23 L Switch' 1"
			cset "name='rt1320-${var:__Amp} OT23 R Switch' 1"
		]
		DisableSequence [
			cset "name='rt1320-${var:__Amp} OT23 L Switch' 0"
			cset "name='rt1320-${var:__Amp} OT23 R Switch' 0"
		]
	}
}

DefineMacro.CrasRt1320Mic.If.mic {
	Condition {
		Type ControlExists
		Control "name='rt1320-${var:__Mic} FU Capture Switch'"
	}
	True {
		EnableSequence [
			cset "name='rt1320-${var:__Mic} FU Capture Switch' 1,1,1,1"
		]
		DisableSequence [
			cset "name='rt1320-${var:__Mic} FU Capture Switch' 0,0,0,0"
		]
	}
}

If.spk {
	Condition {
		Type String
		String1 "rt1320"
		String2 "${var:CrasSpkFile}"
	}
	True.SectionDevice."Speaker" {
		Comment "Speaker"

		If.two {
			Condition {
				Type ControlExists
				Control "name='rt1320-2 OT23 L Switch'"
			}
			True {
				Macro.amp1.CrasRt1320Amp { Amp 1  Sel "L,L" }
				Macro.amp2.CrasRt1320Amp { Amp 2  Sel "R,R" }
			}
			False.Macro.amp1.CrasRt1320Amp { Amp 1  Sel "L,R" }
		}

		EnableSequence [
			cset "name='Speaker Switch' on"
		]

		DisableSequence [
			cset "name='Speaker Switch' off"
		]

		Value {
			PlaybackPriority 100
			PlaybackPCM "hw:${CardId},2"
		}
	}
}

If.mic {
	Condition {
		Type String
		String1 "rt1320"
		String2 "${var:CrasMicFile}"
	}
	True.SectionDevice."Internal Mic" {
		Comment "Internal Microphones"

		Macro.mic1.CrasRt1320Mic { Mic 1 }
		Macro.mic2.CrasRt1320Mic { Mic 2 }

		If.dmicvol {
			Condition {
				Type ControlExists
				Control "name='rt1320-1 FU Capture Volume'"
			}
			True.Value.CaptureMixerElem "rt1320-1 FU"
		}

		Value {
			CapturePriority 100
			CapturePCM "hw:${CardId},4"
		}
	}
}
