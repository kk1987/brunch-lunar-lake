# cras profile: Realtek rt1318 SoundWire amplifiers ("rt1318-1", "rt1318-2"),
# "Speaker" PCM 2; one "DAC Switch" per amplifier, RX Channel Select as for
# rt1316.  No volume control; cras uses software volume.

DefineMacro.CrasRt1318Amp.If.amp {
	Condition {
		Type ControlExists
		Control "name='rt1318-${var:__Amp} DAC Switch'"
	}
	True {
		EnableSequence [
			cset "name='rt1318-${var:__Amp} RX Channel Select' ${var:__Sel}"
			cset "name='rt1318-${var:__Amp} DAC Switch' 1"
		]
		DisableSequence [
			cset "name='rt1318-${var:__Amp} DAC Switch' 0"
		]
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	If.two {
		Condition {
			Type ControlExists
			Control "name='rt1318-2 DAC Switch'"
		}
		True {
			Macro.amp1.CrasRt1318Amp { Amp 1  Sel "L,L" }
			Macro.amp2.CrasRt1318Amp { Amp 2  Sel "R,R" }
		}
		False.Macro.amp1.CrasRt1318Amp { Amp 1  Sel "L,R" }
	}

	EnableSequence [
		cset "name='Speaker Switch' on"
	]

	DisableSequence [
		cset "name='Speaker Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},2"
	}
}
