# cras profile: Realtek rt721 SDCA multi-function codec (headset on PCM 0 /
# 1, speaker amplifier on PCM 2, DMICs on PCM 4), reported as hs:rt721
# spk:rt721 mic:rt721 -- or spk:rt721+rt1320 when rt1320 amplifiers drive the
# speakers (then cras/rt1320.conf owns the Speaker).  Same layout as rt722;
# the DMIC front/rear pairs are selected on the ADC 07 / ADC 10 muxes.

If.hs {
	Condition {
		Type String
		String1 "rt721"
		String2 "${var:CrasHsFile}"
	}
	True {
		SectionDevice."Headphone" {
			Comment "Headphones"

			EnableSequence [
				cset "name='Headphone Switch' on"
				cset "name='rt721 FU05 Playback Volume' 87,87"
			]

			DisableSequence [
				cset "name='Headphone Switch' off"
			]

			If.hpvol {
				Condition {
					Type ControlExists
					Control "name='rt721 FU05 Playback Volume'"
				}
				True.Value.PlaybackMixerElem "rt721 FU05"
			}

			Value {
				PlaybackPriority 200
				PlaybackPCM "hw:${CardId},0"
				JackDev "${CardName} Headset Jack"
			}
		}

		SectionDevice."Mic" {
			Comment "Headset Microphone"

			EnableSequence [
				cset "name='rt721 ADC 09 Mux' 'MIC2'"
				cset "name='Headset Mic Switch' on"
				cset "name='rt721 FU0F Capture Switch' 1,1"
				cset "name='rt721 FU0F Capture Volume' 63,63"
				cset "name='rt721 FU33 Boost Volume' 1,1"
			]

			DisableSequence [
				cset "name='rt721 FU0F Capture Switch' 0,0"
				cset "name='Headset Mic Switch' off"
			]

			If.micvol {
				Condition {
					Type ControlExists
					Control "name='rt721 FU0F Capture Volume'"
				}
				True.Value.CaptureMixerElem "rt721 FU0F"
			}

			Value {
				CapturePriority 200
				CapturePCM "hw:${CardId},1"
				JackDev "${CardName} Headset Jack"
			}
		}
	}
}

If.spk {
	Condition {
		Type String
		String1 "rt721"
		String2 "${var:CrasSpkFile}"
	}
	True.SectionDevice."Speaker" {
		Comment "Speaker"

		EnableSequence [
			cset "name='Speaker Switch' on"
			cset "name='rt721 FU06 Playback Volume' 87,87"
		]

		DisableSequence [
			cset "name='Speaker Switch' off"
		]

		If.spkvol {
			Condition {
				Type ControlExists
				Control "name='rt721 FU06 Playback Volume'"
			}
			True.Value.PlaybackMixerElem "rt721 FU06"
		}

		Value {
			PlaybackPriority 100
			PlaybackPCM "hw:${CardId},2"
		}
	}
}

If.mic {
	Condition {
		Type String
		String1 "rt721"
		String2 "${var:CrasMicFile}"
	}
	True.SectionDevice."Internal Mic" {
		Comment "Internal Microphones"

		EnableSequence [
			cset "name='rt721 ADC 07 R Mux' 'DMIC1 FE'"
			cset "name='rt721 ADC 07 L Mux' 'DMIC1 RE'"
			cset "name='rt721 ADC 10 R Mux' 'DMIC2 FE'"
			cset "name='rt721 ADC 10 L Mux' 'DMIC2 RE'"
			cset "name='rt721 FU1E Capture Switch' 1,1,1,1"
			cset "name='rt721 FU1E Capture Volume' 63,63,63,63"
		]

		DisableSequence [
			cset "name='rt721 FU1E Capture Switch' 0,0,0,0"
		]

		If.dmicvol {
			Condition {
				Type ControlExists
				Control "name='rt721 FU1E Capture Volume'"
			}
			True.Value.CaptureMixerElem "rt721 FU1E"
		}

		Value {
			CapturePriority 100
			CapturePCM "hw:${CardId},4"
		}
	}
}
