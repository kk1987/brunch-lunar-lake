# cras profile: Cirrus Logic cs35l56 / cs35l57 SoundWire amplifiers.
#
# The machine driver gives the amplifiers the name prefixes "AMP1".."AMP8"
# in order, so their controls are "AMPn Speaker Switch" / "AMPn Speaker
# Volume".  The speaker DAI link is "Speaker" PCM 2 in every sof-*-cs35l56
# topology.
#
# Nothing here assumes a particular amplifier count: each amplifier is
# switched on only if its control exists, and the list of volume elements
# handed to cras (CoupledMixers) is built from the controls that are present.
# The count check is nested on purpose: alsa-lib 1.2.8 evaluates all sibling
# If blocks in one pass, so a chain of sibling blocks appending to the same
# variable would collide.

DefineMacro.CrasAmpSeq.If.amp {
	Condition {
		Type ControlExists
		Control "name='AMP${var:__Amp} Speaker Switch'"
	}
	True {
		EnableSequence [
			cset "name='AMP${var:__Amp} Speaker Switch' 1"
		]
		DisableSequence [
			cset "name='AMP${var:__Amp} Speaker Switch' 0"
		]
	}
}

Define.CrasAmpMixers ""

If.amp1 {
	Condition {
		Type ControlExists
		Control "name='AMP1 Speaker Volume'"
	}
	True {
		Define.CrasAmpMixers "AMP1 Speaker"
		If.amp2 {
			Condition {
				Type ControlExists
				Control "name='AMP2 Speaker Volume'"
			}
			True {
				Define.CrasAmpMixers "AMP1 Speaker,AMP2 Speaker"
				If.amp3 {
					Condition {
						Type ControlExists
						Control "name='AMP3 Speaker Volume'"
					}
					True {
						Define.CrasAmpMixers "AMP1 Speaker,AMP2 Speaker,AMP3 Speaker"
						If.amp4 {
							Condition {
								Type ControlExists
								Control "name='AMP4 Speaker Volume'"
							}
							True {
								Define.CrasAmpMixers "AMP1 Speaker,AMP2 Speaker,AMP3 Speaker,AMP4 Speaker"
								If.amp5 {
									Condition {
										Type ControlExists
										Control "name='AMP5 Speaker Volume'"
									}
									True {
										Define.CrasAmpMixers "AMP1 Speaker,AMP2 Speaker,AMP3 Speaker,AMP4 Speaker,AMP5 Speaker"
										If.amp6 {
											Condition {
												Type ControlExists
												Control "name='AMP6 Speaker Volume'"
											}
											True {
												Define.CrasAmpMixers "AMP1 Speaker,AMP2 Speaker,AMP3 Speaker,AMP4 Speaker,AMP5 Speaker,AMP6 Speaker"
												If.amp7 {
													Condition {
														Type ControlExists
														Control "name='AMP7 Speaker Volume'"
													}
													True {
														Define.CrasAmpMixers "AMP1 Speaker,AMP2 Speaker,AMP3 Speaker,AMP4 Speaker,AMP5 Speaker,AMP6 Speaker,AMP7 Speaker"
														If.amp8 {
															Condition {
																Type ControlExists
																Control "name='AMP8 Speaker Volume'"
															}
															True.Define.CrasAmpMixers "AMP1 Speaker,AMP2 Speaker,AMP3 Speaker,AMP4 Speaker,AMP5 Speaker,AMP6 Speaker,AMP7 Speaker,AMP8 Speaker"
														}
													}
												}
											}
										}
									}
								}
							}
						}
					}
				}
			}
		}
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	Macro.amp1.CrasAmpSeq { Amp 1 }
	Macro.amp2.CrasAmpSeq { Amp 2 }
	Macro.amp3.CrasAmpSeq { Amp 3 }
	Macro.amp4.CrasAmpSeq { Amp 4 }
	Macro.amp5.CrasAmpSeq { Amp 5 }
	Macro.amp6.CrasAmpSeq { Amp 6 }
	Macro.amp7.CrasAmpSeq { Amp 7 }
	Macro.amp8.CrasAmpSeq { Amp 8 }

	If.mixers {
		Condition {
			Type String
			Empty "${var:CrasAmpMixers}"
		}
		False.Value.CoupledMixers "${var:CrasAmpMixers}"
	}

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},2"
	}
}
