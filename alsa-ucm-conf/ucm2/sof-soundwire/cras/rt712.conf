# cras profile: Realtek rt712 SDCA codec -- headset (rt712-sdca-aif1: PCM 0
# out / PCM 1 in), its own speaker amplifier (aif2: "Speaker" PCM 2) and, on
# the -VB variant, integrated DMICs (aif3: "Microphones" PCM 4).  The card
# reports hs:rt712, spk:rt712 (or spk:rt712+rt1320 / spk:rt1320 when rt1320
# amplifiers drive the speakers, handled by cras/rt1320.conf) and mic:rt712
# (VB) or mic:rt712-dmic (separate rt1712 part, cras/rt712-dmic.conf).
# Each section is defined only when this file owns that function.

If.hs {
	Condition {
		Type String
		String1 "rt712"
		String2 "${var:CrasHsFile}"
	}
	True {
		SectionDevice."Headphone" {
			Comment "Headphones"

			EnableSequence [
				cset "name='Headphone Switch' on"
				cset "name='rt712 FU05 Playback Switch' 1,1"
				cset "name='rt712 FU05 Playback Volume' 87,87"
			]

			DisableSequence [
				cset "name='Headphone Switch' off"
			]

			If.hpvol {
				Condition {
					Type ControlExists
					Control "name='rt712 FU05 Playback Volume'"
				}
				True.Value.PlaybackMixerElem "rt712 FU05"
			}

			Value {
				PlaybackPriority 200
				PlaybackPCM "hw:${CardId},0"
				JackDev "${CardName} Headset Jack"
			}
		}

		SectionDevice."Mic" {
			Comment "Headset Microphone"

			EnableSequence [
				cset "name='rt712 ADC 23 Mux' 'MIC2'"
				cset "name='Headset Mic Switch' on"
				cset "name='rt712 FU0F Capture Switch' 1,1"
				cset "name='rt712 FU0F Capture Volume' 57,57"
			]

			DisableSequence [
				cset "name='rt712 FU0F Capture Switch' 0,0"
				cset "name='Headset Mic Switch' off"
			]

			If.micvol {
				Condition {
					Type ControlExists
					Control "name='rt712 FU0F Capture Volume'"
				}
				True.Value.CaptureMixerElem "rt712 FU0F"
			}

			Value {
				CapturePriority 200
				CapturePCM "hw:${CardId},1"
				JackDev "${CardName} Headset Jack"
			}
		}
	}
}

If.spk {
	Condition {
		Type String
		String1 "rt712"
		String2 "${var:CrasSpkFile}"
	}
	True.SectionDevice."Speaker" {
		Comment "Speaker"

		EnableSequence [
			cset "name='rt712 OT23 L Switch' 1"
			cset "name='rt712 OT23 R Switch' 1"
			cset "name='Speaker Switch' on"
		]

		DisableSequence [
			cset "name='Speaker Switch' off"
			cset "name='rt712 OT23 L Switch' 0"
			cset "name='rt712 OT23 R Switch' 0"
		]

		If.spkvol {
			Condition {
				Type ControlExists
				Control "name='rt712 FU06 Playback Volume'"
			}
			True.Value.PlaybackMixerElem "rt712 FU06"
		}

		Value {
			PlaybackPriority 100
			PlaybackPCM "hw:${CardId},2"
		}
	}
}

If.mic {
	Condition {
		Type String
		String1 "rt712"
		String2 "${var:CrasMicFile}"
	}
	True.SectionDevice."Internal Mic" {
		Comment "Internal Microphones"

		EnableSequence [
			cset "name='rt712 ADC 0A Mux' 'DMIC1'"
			cset "name='rt712 ADC 0B Mux' 'DMIC2'"
			cset "name='rt712 FU1E Capture Switch' 1,1,1,1"
			cset "name='rt712 FU1E Capture Volume' 47,47,47,47"
		]

		DisableSequence [
			cset "name='rt712 FU1E Capture Switch' 0,0,0,0"
		]

		If.dmicvol {
			Condition {
				Type ControlExists
				Control "name='rt712 FU1E Capture Volume'"
			}
			True.Value.CaptureMixerElem "rt712 FU1E"
		}

		Value {
			CapturePriority 100
			CapturePCM "hw:${CardId},4"
		}
	}
}
