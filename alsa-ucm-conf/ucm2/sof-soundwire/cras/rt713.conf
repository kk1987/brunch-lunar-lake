# cras profile: Realtek rt713 SDCA headset codec (kernel part 0x713, driven
# by the rt712-sdca driver with the "rt713 " prefix; reported as
# hs:rt713-sdca, mapped to this file).  Headset on PCM 0 / 1; the -VB variant
# adds integrated DMICs (mic:rt713, "Microphones" PCM 4); the separate rt1713
# DMIC part is mic:rt713-dmic (cras/rt713-dmic.conf).  No speaker amplifier.

If.hs {
	Condition {
		Type String
		String1 "rt713"
		String2 "${var:CrasHsFile}"
	}
	True {
		SectionDevice."Headphone" {
			Comment "Headphones"

			EnableSequence [
				cset "name='Headphone Switch' on"
				cset "name='rt713 FU05 Playback Switch' 1,1"
				cset "name='rt713 FU05 Playback Volume' 87,87"
			]

			DisableSequence [
				cset "name='Headphone Switch' off"
			]

			If.hpvol {
				Condition {
					Type ControlExists
					Control "name='rt713 FU05 Playback Volume'"
				}
				True.Value.PlaybackMixerElem "rt713 FU05"
			}

			Value {
				PlaybackPriority 200
				PlaybackPCM "hw:${CardId},0"
				JackDev "${CardName} Headset Jack"
			}
		}

		SectionDevice."Mic" {
			Comment "Headset Microphone"

			EnableSequence [
				cset "name='rt713 ADC 23 Mux' 'MIC2'"
				cset "name='Headset Mic Switch' on"
				cset "name='rt713 FU0F Capture Switch' 1,1"
				cset "name='rt713 FU0F Capture Volume' 57,57"
			]

			DisableSequence [
				cset "name='rt713 FU0F Capture Switch' 0,0"
				cset "name='Headset Mic Switch' off"
			]

			If.micvol {
				Condition {
					Type ControlExists
					Control "name='rt713 FU0F Capture Volume'"
				}
				True.Value.CaptureMixerElem "rt713 FU0F"
			}

			Value {
				CapturePriority 200
				CapturePCM "hw:${CardId},1"
				JackDev "${CardName} Headset Jack"
			}
		}
	}
}

If.mic {
	Condition {
		Type String
		String1 "rt713"
		String2 "${var:CrasMicFile}"
	}
	True.SectionDevice."Internal Mic" {
		Comment "Internal Microphones"

		EnableSequence [
			cset "name='rt713 ADC 0A Mux' 'DMIC1'"
			cset "name='rt713 ADC 0B Mux' 'DMIC2'"
			cset "name='rt713 FU1E Capture Switch' 1,1,1,1"
			cset "name='rt713 FU1E Capture Volume' 47,47,47,47"
		]

		DisableSequence [
			cset "name='rt713 FU1E Capture Switch' 0,0,0,0"
		]

		If.dmicvol {
			Condition {
				Type ControlExists
				Control "name='rt713 FU1E Capture Volume'"
			}
			True.Value.CaptureMixerElem "rt713 FU1E"
		}

		Value {
			CapturePriority 100
			CapturePCM "hw:${CardId},4"
		}
	}
}
