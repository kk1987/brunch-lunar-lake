# cras profile: Realtek rt1308 SoundWire amplifiers ("rt1308-1", "rt1308-2"
# prefixes), "Speaker" PCM 2.  One amplifier plays both channels (RX Channel
# Select LR); two amplifiers take one channel each (LL / RR).  The count is
# read from the controls that exist, not from cfg-amp.  No volume control on
# these parts, so cras uses software volume.

DefineMacro.CrasRt1308Amp.If.amp {
	Condition {
		Type ControlExists
		Control "name='rt1308-${var:__Amp} DAC L Switch'"
	}
	True {
		EnableSequence [
			cset "name='rt1308-${var:__Amp} RX Channel Select' ${var:__Sel}"
			cset "name='rt1308-${var:__Amp} DAC L Switch' 1"
			cset "name='rt1308-${var:__Amp} DAC R Switch' 1"
		]
		DisableSequence [
			cset "name='rt1308-${var:__Amp} DAC L Switch' 0"
			cset "name='rt1308-${var:__Amp} DAC R Switch' 0"
		]
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	If.two {
		Condition {
			Type ControlExists
			Control "name='rt1308-2 DAC L Switch'"
		}
		True {
			Macro.amp1.CrasRt1308Amp { Amp 1  Sel "LL" }
			Macro.amp2.CrasRt1308Amp { Amp 2  Sel "RR" }
		}
		False.Macro.amp1.CrasRt1308Amp { Amp 1  Sel "LR" }
	}

	EnableSequence [
		cset "name='Speaker Switch' on"
	]

	DisableSequence [
		cset "name='Speaker Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},2"
	}
}
