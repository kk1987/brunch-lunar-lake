Syntax 6

# brunch: replaces the alsa-ucm-conf 1.2.8 profile (the version ChromeOS's
# alsa-lib 1.2.8 can parse; UCM Syntax 7+ profiles from newer alsa-ucm-conf
# releases fail with "Incompatible syntax").
#
# The 1.2.8 profile only knows the Realtek SoundWire codecs; on a card with
# Cirrus Logic cs42l43 / cs35l56 it tries to include a per-codec file that
# does not exist, the whole UCM fails to load, and cras falls back to guessing
# nodes from mixer control names -- which fails too, because every Cirrus
# control carries a "cs42l43 " / "AMPn " prefix.  The result is a "Speaker"
# node on the headphone PCM and silence from the real speakers.
#
# The same happens for every Realtek SoundWire codec newer than rt711 /
# rt1316 (rt712, rt713, rt721, rt722, rt1318, rt1320, ...).
#
# For the codecs that have a profile in sof-soundwire/cras/ (all the Cirrus
# and Realtek SoundWire parts in the kernel 7.1 Intel machine tables) this
# file selects those cras-specific device profiles and sets
# FullySpecifiedUCM, so cras builds its nodes from the PCM numbers and jack
# devices declared there.  Every other combination is handled exactly as
# alsa-ucm-conf 1.2.8 did.

SectionUseCase."HiFi" {
	File "/sof-soundwire/HiFi.conf"
	Comment "Play HiFi quality Music"
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"

Define {
	SpeakerCodec1 ""
	SpeakerChannels1 "2"
	SpeakerAmps1 "0"
	HeadsetCodec1 ""
	MicCodec1 ""
	Mics1 "0"
	CrasProfile ""
	CrasHsFile ""
	CrasSpkFile ""
	CrasMicFile ""
}

DefineRegex {
	SpeakerCodec {
		Regex " spk:([a-z0-9]+((-sdca)|(-spk)|(-bridge))?(\\+[a-z0-9]+((-spk)?))?)"
		String "${CardComponents}"
	}
	SpeakerChannels {
		Regex " cfg-spk:([0-9]+)"
		String "${CardComponents}"
	}
	SpeakerAmps {
		Regex " cfg-amp:([0-9]+)"
		String "${CardComponents}"
	}
	HeadsetCodec {
		Regex " hs:([a-z0-9]+(-sdca)?)"
		String "${CardComponents}"
	}
	MicCodec {
		Regex " mic:([a-z0-9]+(-dmic)?(-sdca)?)"
		String "${CardComponents}"
	}
	Mics {
		Regex " cfg-mics:([1-9][0-9]*)"
		String "${CardComponents}"
	}
}

# Older kernels reported the cs42l43 speaker path and the cs35l56 amplifiers
# as two separate spk: tags; kernel 6.16+ joins them with "+".
If.old_multi_spk {
	Condition {
		Type RegexMatch
		Regex "(spk:cs42l43-spk .*spk:cs35l56( |$))|(spk:cs35l56 .*spk:cs42l43-spk( |$))"
		String "${CardComponents}"
	}
	True.Define.SpeakerCodec1 "cs42l43-spk+cs35l56"
}

If.hs_init {
	Condition {
		Type RegexMatch
		Regex "(rt5682|rt700|rt711(-sdca)?)"
		String "${var:HeadsetCodec1}"
	}
	True.Include.hs_init.File "/codecs/${var:HeadsetCodec1}/init.conf"
}

If.mic_init {
	Condition {
		Type RegexMatch
		Regex "(rt715(-sdca)?)"
		String "${var:MicCodec1}"
	}
	True.Include.mic_init.File "/codecs/${var:MicCodec1}/init.conf"
}

# ---- cras profiles ---------------------------------------------------------
#
# Each function on the card (headset / speaker / microphones) maps to one file
# in sof-soundwire/cras/.  Multi-function parts (rt712, rt713, rt721, rt722,
# rt1320) serve two or three functions from one file, which HiFi.conf then
# includes once; the file itself checks CrasHsFile / CrasSpkFile / CrasMicFile
# to decide which SectionDevices to define.  When every function present has a
# file, CrasProfile is set and HiFi.conf declares FullySpecifiedUCM; otherwise
# the alsa-ucm-conf 1.2.8 behaviour above applies unchanged.
#
# alsa-lib evaluates sibling If blocks in one pass and applies the Define
# blocks they merge in the next, so the three steps are nested to run in
# order: copy the codec names, fold the combined speaker tags, then check.
If.cras_files {
	Condition { Type AlwaysTrue }
	True {
		Define {
			CrasHsFile "${var:HeadsetCodec1}"
			CrasSpkFile "${var:SpeakerCodec1}"
			CrasMicFile "${var:MicCodec1}"
		}

		# rt712 / rt721 keep their own amplifier DAI when paired with rt1320
		# amplifiers; the speakers are on the rt1320 parts.
		If.cras_spk_rt1320 {
			Condition {
				Type RegexMatch
				Regex "^rt7(12|21)[+]rt1320$"
				String "${var:SpeakerCodec1}"
			}
			True.Define.CrasSpkFile "rt1320"
		}

		# The kernel appends -sdca to rt711 and rt713 headset tags; rt711 has
		# two drivers (rt711.conf / rt711-sdca.conf), rt713 only one.
		If.cras_hs_rt713 {
			Condition {
				Type String
				String1 "rt713-sdca"
				String2 "${var:HeadsetCodec1}"
			}
			True.Define.CrasHsFile "rt713"
		}

		If.cras_stage3 {
			Condition { Type AlwaysTrue }
			True.If.cras_profile {
				Condition {
					Type RegexMatch
					Regex "^(cs42l43|rt711|rt711-sdca|rt712|rt713|rt721|rt722)?#(cs35l56|cs42l43-spk|cs42l43-spk[+]cs35l56|cs35l56[+]cs42l43-spk|cs35l56-bridge|rt1308|rt1316|rt1318|rt1320|rt712|rt721|rt722)?#(cs42l43-dmic|dmic|rt715|rt715-sdca|rt712-dmic|rt713-dmic|rt712|rt713|rt721|rt722|rt1320)?$"
					String "${var:CrasHsFile}#${var:CrasSpkFile}#${var:CrasMicFile}"
				}
				True.If.cras_profile_nonempty {
					Condition {
						Type String
						Empty "${var:CrasHsFile}${var:CrasSpkFile}${var:CrasMicFile}"
					}
					False.Define.CrasProfile "1"
				}
			}
		}
	}
}
